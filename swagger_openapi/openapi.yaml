openapi: 3.0.3
info:
  title: 测试agent系统-接口文档
  description: 可模拟后端未开发完成，提前定义接口契约的场景
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/api
    description: 本地测试环境
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: 请求成功
        data:
          type: object

paths:
  /user/login:
    post:
      summary: 用户账号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "test01"
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: 登录成功返回token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                success:
                  value:
                    code: 200
                    msg: 登录成功
                    data:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9

  /user/info:
    get:
      summary: 获取登录用户详情
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用户信息返回成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /user/add:
    post:
      summary: 新增系统用户
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                  example: "张三"
                phone:
                  type: string
                  example: "13800138000"
                age:
                  type: integer
                  example: 25
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /user/delete/{id}:
    delete:
      summary: 根据id删除用户
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /user/list:
    get:
      summary: 分页查询用户列表
      security:
        - bearerAuth: []
      parameters:
        - name: pageNum
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            example: 10
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            example: "张"
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
